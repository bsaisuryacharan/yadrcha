<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#0a0a0d" />
<meta name="color-scheme" content="dark" />
<meta name="description" content="Yadrcha — endless random Telugu film music. Pick an era or a year, play whole albums, never hear a repeat." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Yadrcha" />
<title>Yadrcha · Telugu Music</title>

<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="assets/icon-192.png" />

<link rel="preconnect" href="https://aac.saavncdn.com" />
<link rel="preconnect" href="https://c.saavncdn.com" crossorigin />
<link rel="preload" href="catalog.json" as="fetch" crossorigin />
<link rel="preload" href="assets/fonts/symbols.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="assets/fonts/jakarta-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="assets/app.css" />
</head>
<body>

<div id="app" class="app">
  <main id="pages" class="pages" aria-live="polite"></main>

  <!-- Mini player — floats above the tab bar -->
  <div id="mini" class="mini" hidden>
    <div class="mini-inner" id="mini-open" role="button" tabindex="0" aria-label="Open player">
      <div class="mini-art"><img id="mini-img" alt="" /></div>
      <div class="mini-meta">
        <div class="mini-title" id="mini-title"></div>
        <div class="mini-sub" id="mini-sub"></div>
      </div>
      <button class="icon-btn" id="mini-like" type="button" aria-label="Like"><span class="ms">favorite</span></button>
      <button class="icon-btn mini-play" id="mini-play" type="button" aria-label="Play"><span class="ms fill">play_arrow</span></button>
      <button class="icon-btn" id="mini-next" type="button" aria-label="Next"><span class="ms fill">skip_next</span></button>
    </div>
    <div class="mini-progress"><i id="mini-bar"></i></div>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Main">
    <a href="#/" data-tab="home"><span class="ms">home</span><b>Home</b></a>
    <a href="#/search" data-tab="search"><span class="ms">search</span><b>Search</b></a>
    <a href="#/library" data-tab="library"><span class="ms">library_music</span><b>Library</b></a>
  </nav>
</div>

<!-- Full-screen player -->
<section id="player" class="player" aria-hidden="true" aria-label="Now playing">
  <div class="player-bg" id="player-bg"></div>
  <div class="player-inner">
    <header class="player-top" id="player-grab">
      <button class="icon-btn" id="player-close" type="button" aria-label="Close player"><span class="ms">keyboard_arrow_down</span></button>
      <div class="player-context">
        <small id="player-ctx-label">Playing from</small>
        <b id="player-ctx-title">Yadrcha Radio</b>
      </div>
      <button class="icon-btn" id="player-more" type="button" aria-label="More options"><span class="ms">more_horiz</span></button>
    </header>

    <div class="player-stage" id="player-stage">
      <div class="player-art" id="player-art">
        <img id="player-img" alt="" />
      </div>
      <div class="player-lyrics" id="player-lyrics" hidden>
        <div class="lyrics-scroll" id="lyrics-scroll"><div class="lyrics-lines" id="lyrics-lines"></div></div>
      </div>
    </div>

    <div class="player-meta">
      <div class="player-titles">
        <h2 id="player-title">—</h2>
        <button type="button" class="player-artist" id="player-artist">—</button>
      </div>
      <button class="icon-btn lg" id="player-like" type="button" aria-label="Like"><span class="ms">favorite</span></button>
    </div>

    <div class="seek" id="seek" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="seek-track"><i class="seek-fill" id="seek-fill"></i><i class="seek-knob" id="seek-knob"></i></div>
      <div class="seek-times"><span id="t-cur">0:00</span><span id="t-tot">0:00</span></div>
    </div>

    <div class="controls">
      <button class="icon-btn" id="btn-shuffle" type="button" aria-label="Shuffle" aria-pressed="false"><span class="ms">shuffle</span></button>
      <button class="icon-btn xl" id="btn-prev" type="button" aria-label="Previous"><span class="ms fill">skip_previous</span></button>
      <button class="play-btn" id="btn-play" type="button" aria-label="Play"><span class="ms fill">play_arrow</span></button>
      <button class="icon-btn xl" id="btn-next" type="button" aria-label="Next"><span class="ms fill">skip_next</span></button>
      <button class="icon-btn" id="btn-repeat" type="button" aria-label="Repeat" aria-pressed="false"><span class="ms">repeat</span></button>
    </div>

    <div class="player-foot">
      <button class="pill-btn" id="btn-lyrics" type="button" aria-pressed="false"><span class="ms">lyrics</span>Lyrics</button>
      <button class="pill-btn" id="btn-album" type="button"><span class="ms">album</span>Album</button>
      <button class="pill-btn" id="btn-queue" type="button"><span class="ms">queue_music</span>Up next</button>
    </div>
  </div>
</section>

<div id="sheets"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<audio id="audio" preload="auto" playsinline></audio>

<div id="splash" class="splash">
  <div class="splash-logo"><img src="assets/icon.svg" alt="" width="72" height="72" /></div>
  <div class="splash-name">Yadrcha</div>
  <div class="splash-sub" id="splash-sub">Tuning in…</div>
</div>

<script type="module" src="src/app.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
